[main]
# Required: every request must carry a valid X-Groupsio-Signature
groupsio_psk = DEFINE_ME
logfile = /var/log/uwsgi-apps/groupsio-hook-app.log
loglevel = info
# Payloads that could not be archived are saved here as .json files
emerg_dir = /var/lib/nginx/groupsio-hook-emerg
# Each list gets a v2 inbox in {inboxdir}/{listname}.{domain}, created on demand
inboxdir = /var/lib/public-inbox/groupsio
# Epoch rotation: "size" (1GB, default) or "annual"
auto_epoch = size

# Optionally, put a specific list somewhere else
#[somelist@groups.io]
#inbox = /var/lib/public-inbox/somelist
