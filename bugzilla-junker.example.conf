# TOML file format
#
# Security Note: This file contains sensitive information (API key).
# Set secure permissions: chmod 600 bugzilla-junker.conf
#
# Path Notes: You can use ~ for home directory and $HOME or other environment variables
# Examples:
#   logfile = '~/logs/bz-comment-junker.log'
#   cache = '$HOME/.cache/bz-comment-junker.cache'
#
[main]
url = 'https://bugzilla.kernel.org'
apikey = '[apikey here]'
cache = '~/.cache/bugzilla-junker.cache'
# logfile = '~/logs/bugzilla-junker.log'

[spam]
comment_tag = 'spam'
bug_group = 'Junk'
bug_status = 'CLOSED'
bug_resolution = 'INVALID'

